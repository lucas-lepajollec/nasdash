# Recommended deployment for a new NasDash installation.
# Existing bind-mount installations should keep docker-compose.example.yml.

services:
  nasdash:
    image: ${NASDASH_IMAGE:-ghcr.io/lucas-lepajollec/nasdash:latest}
    container_name: nasdash
    ports:
      - "${NASDASH_BIND_ADDRESS:-127.0.0.1}:2504:2504"
    pid: "host"
    volumes:
      - nasdash-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 2504
      HOSTNAME: 0.0.0.0
      NASDASH_ADMIN_PASSWORD: ${NASDASH_ADMIN_PASSWORD:-}
      NASDASH_VIEWER_PASSWORD: ${NASDASH_VIEWER_PASSWORD:-}
      NASDASH_JWT_SECRET: ${NASDASH_JWT_SECRET:-}
    depends_on:
      - docker-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: nasdash-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      DELETE: 0
      AUTH: 0
      BUILD: 0
      EXEC: 0
      SYSTEM: 0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  nasdash-data:
    name: nasdash-data
