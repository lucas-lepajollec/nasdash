# Configuration Docker Compose pour NasDash (Exemple)
# Ce fichier décrit le déploiement multi-conteneurs de NasDash et de son proxy sécurisé pour la socket Docker.

services:
  # Service principal NasDash
  nasdash:
    image: ${NASDASH_IMAGE:-ghcr.io/lucas-lepajollec/nasdash:latest}
    container_name: nasdash
    ports:
      # Port exposé sur la machine hôte : port interne de l'application
      - "${NASDASH_BIND_ADDRESS:-127.0.0.1}:2504:2504"
    # Permet à la bibliothèque 'systeminformation' d'accéder aux statistiques réelles de la machine hôte (CPU, RAM, Disques)
    # au lieu de lire uniquement les limites du conteneur de l'application.
    pid: "host"
    volumes:
      # Compatibilité historique : données visibles dans ./data sur l'hôte.
      # Préparez les droits UID/GID 1001:1001 avant le premier démarrage.
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=2504
      - HOSTNAME=0.0.0.0
      # À définir dans un fichier .env. Si les mots de passe sont absents,
      # NasDash en génère de robustes et les affiche une fois dans ses logs.
      - NASDASH_ADMIN_PASSWORD=${NASDASH_ADMIN_PASSWORD:-}
      - NASDASH_VIEWER_PASSWORD=${NASDASH_VIEWER_PASSWORD:-}
      - NASDASH_JWT_SECRET=${NASDASH_JWT_SECRET:-}
    depends_on:
      - docker-proxy
    extra_hosts:
      # Permet d'accéder aux services de la machine hôte (ex: WatchYourLAN) via host.docker.internal
      # Utile sur Linux où cette entrée n'est pas créée automatiquement par Docker Desktop
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0750
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # Proxy sécurisé pour la socket Docker (évite de monter la socket Docker directement dans le conteneur NasDash)
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: nasdash-docker-proxy
    volumes:
      # Montage en lecture seule de la socket Docker de l'hôte
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # --- ACTIONS AUTORISÉES (1 = Actif, 0 = Inactif) ---
      # Permet de lister les conteneurs et de lire leur statut
      - CONTAINERS=1
      # Permet de lister les images Docker locales
      - IMAGES=1
      # Permet de lister les volumes Docker
      - VOLUMES=1
      # Permet de lire les configurations réseau de Docker
      - NETWORKS=1
      # Permet de récupérer les informations globales du moteur Docker
      - INFO=1
      # Requis pour démarrer, arrêter et redémarrer les conteneurs (actions POST)
      - POST=1
      
      # --- SÉCURITÉ CONCERNANT LA SUPPRESSION (DELETE) ---
      # REMARQUE : Définir 'DELETE=1' permet de supprimer des images, des volumes et des conteneurs depuis l'UI de NasDash.
      # Pour interdire toute suppression accidentelle ou malveillante de vos ressources Docker locales,
      # vous pouvez désactiver ce droit en changeant la valeur par 'DELETE=0' ou en supprimant simplement la ligne ci-dessous.
      - DELETE=0

      # --- ACTIONS COMPLÈTEMENT BLOQUÉES (Par défaut) ---
      - AUTH=0
      - BUILD=0
      - EXEC=0
      - SYSTEM=0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
