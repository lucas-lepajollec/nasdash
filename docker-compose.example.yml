# Copy-ready NasDash example with data visible in ./data on the host.

services:
  nasdash:
    image: ${NASDASH_IMAGE:-ghcr.io/lucas-lepajollec/nasdash:latest}
    container_name: nasdash
    ports:
      - "2504:2504"
    volumes:
      - ./data:/app/data
    environment:
      NASDASH_ADMIN_PASSWORD: ${NASDASH_ADMIN_PASSWORD:-}
      NASDASH_VIEWER_PASSWORD: ${NASDASH_VIEWER_PASSWORD:-}
      NASDASH_JWT_SECRET: ${NASDASH_JWT_SECRET:-}
    pid: host
    depends_on:
      - docker-proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: nasdash-docker-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      NETWORKS: 1
      INFO: 1
      POST: 1
      DELETE: 0
    restart: unless-stopped
