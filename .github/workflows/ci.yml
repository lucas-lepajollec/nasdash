name: Continuous Integration

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three independent jobs run side by side: the slowest (browser tests) sets the
# wall time instead of the sum of all of them.
jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          npm run check:version
          npm run lint
          npx tsc --noEmit
          npm test

      - name: Validate interface translations
        run: npm run check:i18n

      - name: Audit all dependencies
        run: |
          npm run check:audit-policy
          npm run audit:dependencies

  # Browser tests run one at a time inside a job (they share one data
  # directory), so they are split across jobs; each builds from the cache.
  application:
    name: Production build and browser tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: 1 of 2
            args: --shard=1/2
            demo: 'false'
          - part: 2 of 2
            args: --shard=2/2
            demo: 'false'
          - part: demo
            args: --grep @demo
            demo: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js reuses compiled modules between builds; the key moves with the
      # sources, older caches still serve as a starting point.
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build application
        run: npm run build

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run isolated browser tests
        run: npm run test:e2e -- ${{ matrix.args }}
        env:
          NASDASH_E2E_SERVER_MODE: production
          NASDASH_DEMO_MODE: ${{ matrix.demo }}

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The branch ruleset requires "Tests and production build": this gate carries
  # that name and passes only when both test jobs succeeded (a skipped or
  # cancelled job must not count as a pass).
  gate:
    name: Tests and production build
    needs: [checks, application]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both test jobs
        run: |
          echo "checks=${{ needs.checks.result }} application=${{ needs.application.result }}"
          test "${{ needs.checks.result }}" = success
          test "${{ needs.application.result }}" = success

  container:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A plain build: importing and exporting a layer cache costs more here
      # than it saves (measured: ~60 s more per run).
      - name: Build local image
        run: docker build --tag nasdash:ci .

      - name: Smoke-test fresh install and persistent upgrade
        run: npm run test:container -- nasdash:ci
